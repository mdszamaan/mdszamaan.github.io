<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:       #050807;
  --bg2:      #0a0f0b;
  --border:   #1c3320;
  --dim:      #2a4a30;
  --green:    #39ff14;
  --green2:   #21c40e;
  --green3:   #0d7a06;
  --amber:    #ffb700;
  --cyan:     #00ffe1;
  --pink:     #ff2d78;
  --white:    #d4f5d4;
  --muted:    #4a7a50;
  --vt:       'VT323', monospace;
  --mono:     'Share Tech Mono', monospace;
}

html{ scroll-behavior:smooth }
body{
  background:var(--bg);
  color:var(--green);
  font-family:var(--mono);
  font-size:13px;
  line-height:1.65;
  overflow-x:hidden;
  position:relative;
}

/* CRT overlay */
body::after{
  content:'';
  position:fixed;inset:0;z-index:9990;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.13) 3px,
    rgba(0,0,0,0.13) 4px
  );
}
/* CRT vignette */
body::before{
  content:'';
  position:fixed;inset:0;z-index:9989;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.7) 100%);
}

/* ── CURSOR ── */
*{ cursor:none!important }
#cur{
  position:fixed;width:10px;height:16px;
  background:var(--green);
  pointer-events:none;z-index:9999;
  transform:translate(-2px,-50%);
  animation:curBlink .6s step-end infinite;
  mix-blend-mode:screen;
}
@keyframes curBlink{0%,100%{opacity:1}50%{opacity:0}}

/* ════════════════════════════════
   BOOT SPLASH
════════════════════════════════ */
#boot{
  position:fixed;inset:0;z-index:5000;
  background:#000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
  font-family:var(--vt);
}
#boot.fade-out{
  animation:bootFade .6s ease forwards;
}
@keyframes bootFade{to{opacity:0;pointer-events:none}}

/* CRT warmup scanline */
#crt-scan{
  position:absolute;
  left:0;right:0;top:-4px;height:4px;
  background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,0.9),rgba(255,255,255,0));
  z-index:2;
  opacity:0;
}

/* BIOS box */
#bios-box{
  border:2px solid #39ff14;
  padding:1.5rem 2.5rem;
  max-width:min(680px,90vw);
  width:100%;
  box-shadow:0 0 40px rgba(57,255,20,0.25),inset 0 0 20px rgba(57,255,20,0.03);
  opacity:0;
  position:relative;z-index:3;
}
#bios-header{
  text-align:center;
  font-size:clamp(18px,4vw,28px);
  color:var(--amber);
  letter-spacing:.1em;
  margin-bottom:.8rem;
  text-shadow:0 0 20px var(--amber);
}
#bios-header span{ color:var(--green); font-size:.7em }
#bios-sub{
  text-align:center;
  font-size:clamp(13px,2.5vw,16px);
  color:#555;
  margin-bottom:1.2rem;
  letter-spacing:.15em;
}
#post-lines{
  font-size:clamp(13px,2.5vw,17px);
  color:var(--green);
  min-height:8rem;
  line-height:1.8;
  border-top:1px solid var(--border);
  padding-top:.8rem;
}
.post-ok{ color:var(--green) }
.post-warn{ color:var(--amber) }
.post-err{ color:var(--pink) }
.post-info{ color:#666 }

/* ASCII SZ */
#ascii-sz{
  font-size:clamp(10px,2vw,14px);
  color:var(--green);
  text-align:center;
  white-space:pre;
  line-height:1.2;
  margin-bottom:1rem;
  text-shadow:0 0 15px rgba(57,255,20,0.5);
  letter-spacing:.1em;
  opacity:0;
}

/* boot progress */
#boot-prog-wrap{
  margin-top:1rem;
  border:1px solid var(--green3);
  height:6px;
  background:#000;
  position:relative;
}
#boot-prog{
  height:100%;width:0;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  transition:width .04s linear;
}
#boot-pct{
  font-size:13px;color:var(--muted);
  margin-top:.3rem;text-align:right;letter-spacing:.05em;
}
#boot-enter{
  text-align:center;margin-top:1rem;
  font-size:clamp(14px,3vw,20px);
  color:var(--cyan);
  opacity:0;
  animation:blinkEnter 1s step-end infinite;
}
@keyframes blinkEnter{0%,100%{opacity:1}50%{opacity:0}}

/* corner decoration */
.boot-corner{
  position:absolute;width:24px;height:24px;
  border-color:var(--green);border-style:solid;
  opacity:.5;
}
.bc-tl{top:6px;left:6px;border-width:1px 0 0 1px}
.bc-tr{top:6px;right:6px;border-width:1px 1px 0 0}
.bc-bl{bottom:6px;left:6px;border-width:0 0 1px 1px}
.bc-br{bottom:6px;right:6px;border-width:0 1px 1px 0}

/* ════════════════════════════════
   FVWM-STYLE WINDOW MANAGER
════════════════════════════════ */

/* top bar */
#topbar{
  position:sticky;top:0;z-index:200;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  height:24px;
  display:flex;align-items:center;
  padding:0 .5rem;
  font-family:var(--vt);
  font-size:16px;
  gap:.5rem;
  user-select:none;
}
.tb-menu{
  display:flex;gap:0;
}
.tb-item{
  padding:0 .8rem;height:24px;
  display:flex;align-items:center;
  color:var(--white);
  text-decoration:none;
  letter-spacing:.05em;
  border-right:1px solid var(--border);
  transition:background .1s,color .1s;
  font-size:15px;
}
.tb-item:first-child{border-left:1px solid var(--border)}
.tb-item:hover,.tb-item.active{
  background:var(--green);
  color:#000;
}
.tb-sep{flex:1}
.tb-right{
  display:flex;align-items:center;gap:.6rem;
  font-size:14px;color:var(--muted);
}
.tb-clock{color:var(--amber);letter-spacing:.05em}
.tb-git{color:var(--green2)}

/* ── PAGE ── */
.page{
  max-width:1020px;margin:0 auto;
  padding:1.2rem 1rem 6rem;
  display:flex;flex-direction:column;
  gap:1rem;
}

/* ── FVWM WINDOW ── */
.win{
  border:1px solid var(--border);
  background:var(--bg2);
  box-shadow:
    2px 2px 0 var(--border),
    0 0 30px rgba(57,255,20,0.04);
  transition:box-shadow .2s;
}
.win:hover{
  box-shadow:
    2px 2px 0 var(--green3),
    0 0 40px rgba(57,255,20,0.1);
}

/* title bar - classic FVWM raised bevel */
.win-title{
  height:22px;
  background:linear-gradient(to bottom,#1c3320 0%,#0f1f12 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 6px;gap:6px;
  position:relative;
}
